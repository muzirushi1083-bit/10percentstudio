<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gravity Shift Dash - 10%studio Game 2</title>
  <meta name="description" content="重力を操り、世界ランキング1位を目指せ！10%studioの第2弾ハイスピードランナー">
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Top Fixed Rival Banner (Outside Game Canvas) -->
    <div id="rival-banner" class="rival-banner hidden">
      <span id="rival-text">あと 50m で 5位 [DASH_HERO] を追い抜く！</span>
    </div>

    <!-- UI Header -->
    <header class="ui-header">
      <div class="brand">10%studio Game 2</div>
      <div class="score-container">
        <div class="score-label">DISTANCE</div>
        <div id="score-display">0m</div>
      </div>
      <div class="high-score-container">
        <div class="score-label">RANK 1ST</div>
        <div id="high-score-display">0m</div>
      </div>
    </header>

    <!-- Start Overlay -->
    <div id="start-screen" class="overlay active">
      <h1 class="game-title">GRAVITY<br><span class="highlight">SHIFT</span></h1>
      <p class="subtitle">AIR-BOOST GRAVITY DASH</p>

      <div class="player-input-box">
        <label for="player-name-input">PLAYER NAME</label>
        <input type="text" id="player-name-input" maxlength="10" placeholder="NAME" value="SPEED_RUNNER">
      </div>

      <div class="menu-button-group">
        <button id="start-btn" class="btn btn-primary">RUN NOW</button>
        <button id="leaderboard-btn" class="btn btn-secondary">🏆 LEADERBOARD</button>
        <a href="../../index.html" class="btn btn-secondary btn-portal">🏠 MAIN PORTAL</a>
      </div>

      <p class="instruction">タップで反転！空中引き返しは最大2回（着地で即回復）</p>
    </div>

    <!-- Leaderboard Modal Overlay -->
    <div id="leaderboard-modal" class="overlay hidden">
      <h2 class="overlay-title">🏆 GLOBAL RANKING</h2>
      <div class="leaderboard-box" id="leaderboard-list">
        <!-- Dynamic Leaderboard Items -->
      </div>
      <button id="close-leaderboard-btn" class="btn btn-secondary">BACK</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-screen" class="overlay hidden">
      <h2 class="overlay-title">CRASHED!</h2>
      <div class="result-box">
        <div class="result-item">
          <span>DISTANCE</span>
          <span id="final-score">0m</span>
        </div>
        <div class="result-item">
          <span>YOUR RANK</span>
          <span id="player-rank-display" class="rank-highlight">RANK 4th</span>
        </div>
      </div>
      
      <div class="action-buttons">
        <button id="restart-btn" class="btn btn-primary">RETRY & RANK UP</button>
        <button id="share-btn" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          SHARE RANK
        </button>
        <a href="../../index.html" class="btn btn-secondary btn-portal">🏠 MAIN PORTAL</a>
      </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="game-canvas"></canvas>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
