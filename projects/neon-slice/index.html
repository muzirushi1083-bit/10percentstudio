<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Slice 2.0 - 10%studio Game</title>
  <meta name="description" content="ランキングで世界と競え！10%studioがお届けする超爽快ネオンワンタップゲーム">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00f0ff">
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- UI Header -->
    <header class="ui-header">
      <div class="brand">10%studio</div>
      <div class="score-container">
        <div class="score-label">SCORE</div>
        <div id="score-display">0</div>
      </div>
      <div class="high-score-container">
        <div class="score-label">RANK 1ST</div>
        <div id="high-score-display">0</div>
      </div>
    </header>

    <!-- In-Game Rival Overtake Banner -->
    <div id="rival-banner" class="rival-banner hidden">
      <span id="rival-text">あと3スコアで 5位 [NeonRider] を追い抜く！</span>
    </div>

    <!-- Top Web Banner Ad Container Placeholder -->
    <div class="web-ad-banner top-ad">
      <span class="ad-label">ADVERTISEMENT</span>
    </div>

    <!-- Start Overlay -->
    <div id="start-screen" class="overlay active">
      <h1 class="game-title">NEON<br><span class="highlight">SLICE</span></h1>
      <p class="subtitle">FEVER & RIVAL RANKING</p>

      <div class="player-input-box">
        <label for="player-name-input">PLAYER NAME</label>
        <input type="text" id="player-name-input" maxlength="10" placeholder="NAME" value="CYBER_HERO">
      </div>

      <button id="start-btn" class="btn btn-primary">PLAY & RANK UP</button>
      <button id="leaderboard-btn" class="btn btn-secondary">🏆 LEADERBOARD</button>
    </div>

    <!-- Leaderboard Modal Overlay -->
    <div id="leaderboard-modal" class="overlay hidden">
      <h2 class="overlay-title">🏆 GLOBAL RANKING</h2>
      <div class="leaderboard-box" id="leaderboard-list">
        <!-- Dynamic Leaderboard Items -->
      </div>
      <button id="close-leaderboard-btn" class="btn btn-secondary">BACK</button>
    </div>

    <!-- Rewarded Ad Playing Modal Overlay -->
    <div id="ad-modal" class="overlay hidden">
      <div class="ad-modal-box">
        <h3>📺 SPONSORED AD</h3>
        <p class="ad-timer-text">REVIVAL IN <span id="ad-countdown">3</span> SECONDS...</p>
        <div class="ad-progress-bar"><div id="ad-progress-fill"></div></div>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-screen" class="overlay hidden">
      <h2 class="overlay-title">GAME OVER</h2>
      <div class="result-box">
        <div class="result-item">
          <span>FINAL SCORE</span>
          <span id="final-score">0</span>
        </div>
        <div class="result-item">
          <span>YOUR RANK</span>
          <span id="player-rank-display" class="rank-highlight">RANK 4th</span>
        </div>
      </div>
      
      <div class="action-buttons">
        <button id="reward-revive-btn" class="btn btn-reward">
          📺 REVIVE (WATCH AD)
        </button>
        <button id="restart-btn" class="btn btn-primary">RETRY & RANK UP</button>
        <button id="share-btn" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          SHARE RANK
        </button>
      </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="game-canvas"></canvas>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg error:', err));
      });
    }
  </script>
</body>
</html>
