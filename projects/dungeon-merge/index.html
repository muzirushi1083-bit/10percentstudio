<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dungeon Slice & Dice - 10%studio Game 3</title>
  <meta name="description" content="ブロックを合成してモンスターを撃破せよ！10%studioがお届けする本格ダンジョンマージローグライク">
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- UI Header -->
    <header class="ui-header">
      <div class="brand">10%studio Game 3</div>
      <div class="floor-container">
        <div class="header-label">FLOOR</div>
        <div id="floor-display">F 1</div>
      </div>
      <div class="gold-container">
        <div class="header-label">GOLD</div>
        <div id="gold-display">0 G</div>
      </div>
    </header>

    <!-- Player Status Bar -->
    <div class="status-bar">
      <div class="stat-box hp-box">
        <span class="stat-icon">❤️</span>
        <div class="hp-bar-bg"><div id="hp-bar-fill"></div></div>
        <span id="hp-text">100/100</span>
      </div>
      <div class="stat-box shield-box">
        <span class="stat-icon">🛡️</span>
        <span id="shield-text">0</span>
      </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-screen" class="overlay active">
      <h1 class="game-title">DUNGEON<br><span class="highlight">SLICE & DICE</span></h1>
      <p class="subtitle">MERGE & ROGUELITE PUZZLE</p>

      <div class="player-input-box">
        <label for="player-name-input">HERO NAME</label>
        <input type="text" id="player-name-input" maxlength="10" placeholder="NAME" value="HERO">
      </div>

      <div class="menu-button-group">
        <button id="start-btn" class="btn btn-primary">ENTER DUNGEON</button>
        <a href="../../index.html" class="btn btn-secondary btn-portal">🏠 MAIN PORTAL</a>
      </div>
      <p class="instruction">同じブロックをタップして合成！⚔️で👾を攻撃！</p>
    </div>

    <!-- Game Over / Victory Overlay -->
    <div id="gameover-screen" class="overlay hidden">
      <h2 id="result-title" class="overlay-title">GAME OVER</h2>
      <div class="result-box">
        <div class="result-item">
          <span>FLOOR REACHED</span>
          <span id="final-floor">F 1</span>
        </div>
        <div class="result-item">
          <span>MONSTERS SLAIN</span>
          <span id="final-kills">0</span>
        </div>
      </div>
      
      <div class="action-buttons">
        <button id="restart-btn" class="btn btn-primary">TRY AGAIN</button>
        <a href="../../index.html" class="btn btn-secondary btn-portal">🏠 MAIN PORTAL</a>
      </div>
    </div>

    <!-- Game Grid Board Area -->
    <div class="board-wrapper">
      <div id="grid-container" class="grid-container">
        <!-- 4x4 Grid Cells generated by JS -->
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
