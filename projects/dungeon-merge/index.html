<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chrono Bounce - 10%studio Game 3</title>
  <meta name="description" content="時間を操りレーザーで画面を全滅させよ！10%studioがお届けする超爽快・時空物理バウンスアクション">
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- UI Header -->
    <header class="ui-header">
      <div class="brand">10%studio Game 3</div>
      <div class="score-container">
        <div class="score-label">STAGE</div>
        <div id="score-display">STAGE 1</div>
      </div>
      <div class="high-score-container">
        <div class="score-label">BEST</div>
        <div id="high-score-display">STAGE 1</div>
      </div>
    </header>

    <!-- In-Game Combo Banner -->
    <div id="combo-banner" class="combo-banner hidden">
      <span id="combo-text">⚡ FEVER BOUNCE x20!</span>
    </div>

    <!-- Start Overlay -->
    <div id="start-screen" class="overlay active">
      <h1 class="game-title">CHRONO<br><span class="highlight">BOUNCE</span></h1>
      <p class="subtitle">SLOW-MOTION LASER BOUNCE</p>

      <div class="player-input-box">
        <label for="player-name-input">PLAYER NAME</label>
        <input type="text" id="player-name-input" maxlength="10" placeholder="NAME" value="TIME_MASTER">
      </div>

      <div class="menu-button-group">
        <button id="start-btn" class="btn btn-primary">LAUNCH LASER</button>
        <a href="../../index.html" class="btn btn-secondary btn-portal">🏠 MAIN PORTAL</a>
      </div>
      <p class="instruction">長押しで時空スロー！発射ごとにブロックが1段降下（最下部でGameOver）</p>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-screen" class="overlay hidden">
      <h2 class="overlay-title">TIME EXPIRED</h2>
      <div class="result-box">
        <div class="result-item">
          <span>STAGE REACHED</span>
          <span id="final-score">STAGE 1</span>
        </div>
      </div>
      
      <div class="action-buttons">
        <button id="restart-btn" class="btn btn-primary">RETRY STAGE</button>
        <a href="../../index.html" class="btn btn-secondary btn-portal">🏠 MAIN PORTAL</a>
      </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="game-canvas"></canvas>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
